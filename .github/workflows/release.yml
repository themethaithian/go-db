name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: macos-latest # Apple Silicon
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install frontend dependencies
        working-directory: app/frontend
        run: npm ci

      - name: Install Wails CLI
        # Pinned to the same version as the wailsapp/wails/v2 module in go.mod.
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.13.0

      - name: Build universal .app
        run: wails build -platform darwin/universal

      - name: Verify universal binary
        run: |
          set -euo pipefail
          archs="$(lipo -archs build/bin/go-db.app/Contents/MacOS/go-db)"
          echo "Architectures: $archs"
          if [[ "$archs" != *"x86_64"* || "$archs" != *"arm64"* ]]; then
            echo "::error::Expected universal binary with x86_64 and arm64, got: $archs"
            exit 1
          fi

      - name: Zip .app bundle
        run: ditto -c -k --keepParent build/bin/go-db.app go-db-macos-universal.zip

      - name: Upload build artifact (dry run)
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: go-db-macos-universal
          path: go-db-macos-universal.zip

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          files: go-db-macos-universal.zip
